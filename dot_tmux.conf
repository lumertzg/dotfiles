set -s escape-time 0
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm*:RGB'

set -g base-index 1
set-option -g focus-events on

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind e split-window -c "#{pane_current_path}"
bind o split-window -h -c "#{pane_current_path}"

# Popups
bind g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

bind f display-popup \
  -d "#{pane_current_path}" \
  -w 50% \
  -h 50% \
  -E "ts"

bind t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% 

# Resizing pane
bind -r C-k resize-pane -U 4
bind -r C-j resize-pane -D 4
bind -r C-h resize-pane -L 4
bind -r C-l resize-pane -R 4

set -g status-position top
set -g status-justify centre
set -g status-left-length 30
set -g status-right ""

set -g status-position top
set -g status-justify centre
set -g status-left-length 30
set -g status-right ""

set -g status-style fg=default,bg=default
set -g window-status-separator ""

set -g window-status-format " #I:#W "
set -g window-status-style fg=default,bg=default,bold

set -g window-status-current-format " #I:#W "
set -g window-status-current-style fg=default,bg=default,reverse,bold

set -g window-status-activity-style fg=default,bg=default,reverse

set -g pane-border-style fg=default
set -g pane-active-border-style fg=default,bold
